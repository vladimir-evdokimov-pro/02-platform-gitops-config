apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd

spec:
  project: default
  
  source:
    repoURL: https://github.com/vladimir-evdokimov-pro/02-platform-gitops-config
    targetRevision: main
    path: apps

  destination:
    namespace: argocd
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      selfHeal: true
      prune: true