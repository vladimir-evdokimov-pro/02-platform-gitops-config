apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  namespace: argocd
  name: ingress-nginx

spec:
  project: default

  source:
    chart: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: 4.10.0

    helm:
      valuesObject:
        controller:
          service:
            type: LoadBalancer

  destination:
    namespace: ingress-nginx
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true